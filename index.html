<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borda OBS</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #wrap {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Glow Neon */
        .neon {
            filter: drop-shadow(0 0 4px #ffb8c6)
                    drop-shadow(0 0 10px #b6d9ff)
                    drop-shadow(0 0 16px #ffe7a3);
        }

        /* Debug */
        .grid-bg {
            background-image:
                linear-gradient(#ffffff22 1px, transparent 1px),
                linear-gradient(90deg, #ffffff22 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .viewbox-outline {
            outline: 2px dashed rgba(255,255,255,0.5);
        }
    </style>

</head>

<body>
<div id="wrap">
    <svg id="svg"></svg>
</div>

<script>
    const svgNS = "http://www.w3.org/2000/svg";

    function p(name, fallback = null) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name) ?? fallback;
    }

    function makeShape(type, w, h, r, s) {
        if (type === "rect" || type === "square") {
            const size = type === "square" ? Math.min(w, h) : null;
            const el = document.createElementNS(svgNS, "rect");
            el.setAttribute("x", s);
            el.setAttribute("y", s);
            el.setAttribute("rx", r);
            el.setAttribute("width", (size ? size : w) - s * 2);
            el.setAttribute("height", (size ? size : h) - s * 2);
            return el;
        }

        if (type === "ellipse") {
            const el = document.createElementNS(svgNS, "ellipse");
            el.setAttribute("cx", w / 2);
            el.setAttribute("cy", h / 2);
            el.setAttribute("rx", w / 2 - s);
            el.setAttribute("ry", h / 2 - s);
            return el;
        }

        if (type === "line-h") {
            const el = document.createElementNS(svgNS, "line");
            el.setAttribute("x1", 0);
            el.setAttribute("y1", h / 2);
            el.setAttribute("x2", w);
            el.setAttribute("y2", h / 2);
            return el;
        }

        if (type === "line-v") {
            const el = document.createElementNS(svgNS, "line");
            el.setAttribute("x1", w / 2);
            el.setAttribute("y1", 0);
            el.setAttribute("x2", w / 2);
            el.setAttribute("y2", h);
            return el;
        }
    }

    /* ================================
       🔥 EFEITOS COMPATÍVEIS COM OBS
       (agora com translate por pixel)
    ================================ */
    function getAnimationValues(effect, w, h) {
        switch (effect) {
            case "horizontal":
                return {
                    x1: `0; -${w}; 0`,
                    x2: `${w}; 0; ${w}`
                };

            case "vertical":
                return {
                    y1: `0; -${h}; 0`,
                    y2: `${h}; 0; ${h}`
                };

            case "diagonal":
                return {
                    x1: `0; -${w}; 0`,
                    x2: `${w}; 0; ${w}`,
                    y1: `0; -${h}; 0`,
                    y2: `${h}; 0; ${h}`
                };

            case "circular":
                return {
                    rot: true
                };

            case "pulse-slide":
                return {
                    x1: `0; -${w}; 0`,
                    x2: `${w}; 0; ${w}`
                };

            case "rgb":
            case "vaporwave":
            case "prism":
            case "blend":
                return { x1:`0; -${w}; 0`, x2:`${w}; 0; ${w}` };

            default:
                return { x1:`0; -${w}; 0`, x2:`${w}; 0; ${w}` };
        }
    }

    window.onload = () => {

        const svg = document.getElementById("svg");

        const w = +p("w", 900);
        const h = +p("h", 300);
        const r = +p("r", 40);
        const s = +p("s", 8);
        const op = +p("op", 1);
        const speed = +p("spd", 15);

        const mode = p("mode", "4");
        const c1 = p("c1", "#ffb8c6");
        const c2 = p("c2", "#b6d9ff");
        const c3 = p("c3", "#ffe7a3");
        const c4 = p("c4", "#e8c8ff");

        const glow = p("glow", "none");
        const debug = p("debug", "off");
        const anim = p("anim", "horizontal");

        svg.setAttribute("viewBox", `0 0 ${w} ${h}`);

        /* ======================
           GRADIENTE DINÂMICO
        ======================= */
        const defs = document.createElementNS(svgNS, "defs");

        const grad = document.createElementNS(svgNS, "linearGradient");
        grad.setAttribute("id", "g");
        grad.setAttribute("gradientUnits", "userSpaceOnUse");
        grad.setAttribute("x1", "0");
        grad.setAttribute("y1", "0");
        grad.setAttribute("x2", w);
        grad.setAttribute("y2", "0");

        function stop(of, color) {
            const st = document.createElementNS(svgNS, "stop");
            st.setAttribute("offset", of);
            st.setAttribute("stop-color", color);
            grad.appendChild(st);
        }

        if (mode === "2") {
            stop("0%", c1);
            stop("100%", c2);
        } else {
            stop("0%", c1);
            stop("33%", c2);
            stop("66%", c3);
            stop("100%", c4);
        }

        const animValues = getAnimationValues(anim, w, h);

        function animTag(attr, values) {
            const a = document.createElementNS(svgNS, "animate");
            a.setAttribute("attributeName", attr);
            a.setAttribute("values", values);
            a.setAttribute("dur", speed + "s");
            a.setAttribute("repeatCount", "indefinite");
            grad.appendChild(a);
        }

        if (animValues.x1) animTag("x1", animValues.x1);
        if (animValues.x2) animTag("x2", animValues.x2);
        if (animValues.y1) animTag("y1", animValues.y1);
        if (animValues.y2) animTag("y2", animValues.y2);

        defs.appendChild(grad);
        svg.appendChild(defs);

        /* ======================
           DESENHAR SHAPE
        ======================= */
        const shapeType = p("shape", "rect");
        const shape = makeShape(shapeType, w, h, r, s);

        shape.setAttribute("fill", "none");
        shape.setAttribute("stroke", "url(#g)");
        shape.setAttribute("stroke-width", s);
        shape.setAttribute("stroke-linecap", "round");
        shape.setAttribute("opacity", op);

        if (glow === "neon") shape.classList.add("neon");

        svg.appendChild(shape);

        /* ======================
           DEBUG
        ======================= */
        const wrap = document.getElementById("wrap");

        wrap.classList.toggle("grid-bg", debug === "grid");
        svg.classList.toggle("viewbox-outline", debug === "viewbox");
    };
</script>

</body>
</html>
