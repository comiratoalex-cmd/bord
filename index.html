<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastel Border Generator</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body class="dark">
    <canvas id="particles"></canvas>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <h1>Pastel Border Generator</h1>

        <div id="tabs">
            <span class="tab active" data-tab="border">Borda</span>
            <span class="tab" data-tab="colors">Cores</span>
            <span class="tab" data-tab="presets">Presets</span>
            <span class="tab" data-tab="advanced">Avançado</span>
            <span id="toggle-theme">🌙</span>
        </div>

        <!-- TAB: BORDA -->
        <div id="tab-border" class="tab-content active">
            <div class="section-title">Formato & Tamanho</div>

            <div class="settings-grid">
                <div>
                    <label>Forma:</label>
                    <select id="shape">
                        <option value="rect">Retângulo</option>
                        <option value="square">Quadrado</option>
                        <option value="ellipse">Elipse</option>
                        <option value="line-h">Linha Horizontal</option>
                        <option value="line-v">Linha Vertical</option>
                    </select>
                </div>

                <div>
                    <label>Largura:</label>
                    <input id="width" type="number" value="800" />
                </div>

                <div>
                    <label>Altura:</label>
                    <input id="height" type="number" value="300" />
                </div>

                <div>
                    <label>Raio:</label>
                    <input id="radius" type="range" min="0" max="200" value="20" />
                </div>

                <div>
                    <label>Espessura:</label>
                    <input id="stroke" type="range" min="1" max="40" value="8" />
                </div>

                <div>
                    <label>Opacidade:</label>
                    <input id="opacity" type="range" min="0.05" max="1" step="0.05" value="1" />
                </div>

                <div>
                    <label>Velocidade:</label>
                    <input id="speed" type="range" min="1" max="40" value="12" />
                </div>
            </div>
        </div>

        <!-- TAB: CORES -->
        <div id="tab-colors" class="tab-content">
            <div class="section-title">Cores</div>

            <div class="settings-grid">
                <div>
                    <label>Modo:</label>
                    <select id="color-mode">
                        <option value="2">2 cores</option>
                        <option value="4" selected>4 cores</option>
                    </select>
                </div>

                <div><label>Cor 1:</label><input id="color1" type="color" value="#ffb8c6" /></div>
                <div><label>Cor 2:</label><input id="color2" type="color" value="#b6d9ff" /></div>
                <div><label>Cor 3:</label><input id="color3" type="color" value="#ffe7a3" /></div>
                <div><label>Cor 4:</label><input id="color4" type="color" value="#e8c8ff" /></div>
            </div>
        </div>

        <!-- TAB: PRESETS -->
        <div id="tab-presets" class="tab-content">
            <div class="section-title">Presets</div>

            <div class="preset-button preset" data-preset="pastel">🌸 Pastel Dream</div>
            <div class="preset-button preset" data-preset="sakura">🌺 Sakura Pink</div>
            <div class="preset-button preset" data-preset="ocean">🌊 Ocean Breeze</div>
            <div class="preset-button preset" data-preset="space">🚀 Space Vaporwave</div>
            <div class="preset-button preset" data-preset="toxic">☢️ Toxic Neon</div>
            <div class="preset-button preset" data-preset="sunset">🌅 Sunset Mix</div>

            <button id="save-url">Gerar URL</button>
            <input id="url-output" readonly />
        </div>

        <!-- TAB: AVANÇADO -->
        <div id="tab-advanced" class="tab-content">
            <div class="section-title">Avançado</div>

            <div class="settings-grid">
                <div>
                    <label>Efeito Glow:</label>
                    <select id="glow">
                        <option value="none">Desligado</option>
                        <option value="soft">Soft</option>
                        <option value="neon">Neon</option>
                        <option value="blurred">Blur</option>
                    </select>
                </div>

                <div>
                    <label>Debug Mode:</label>
                    <select id="debug">
                        <option value="off">Off</option>
                        <option value="grid">Grid</option>
                        <option value="viewbox">Viewbox</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section-title">Link OBS</div>

        <button id="generate">Gerar</button>
        <button id="copy">Copiar</button>

        <input id="obs-link" readonly />
    </aside>

    <!-- PREVIEW -->
    <div id="preview-area">
        <svg id="preview"></svg>
    </div>

    <script src="script.js"></script>
</body>
</html>
