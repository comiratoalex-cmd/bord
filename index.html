<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Pastel Border Generator — Premium</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="dark">

    <!-- Fundo com partículas -->
    <canvas id="particles"></canvas>

    <!-- Sidebar -->
    <aside id="sidebar">

        <h1 class="app-title">Pastel Border Generator</h1>
        <h2 class="app-sub">Edição Premium</h2>

        <!-- TABS -->
        <div id="tabs">
            <span class="tab active" data-tab="tab-border">Borda</span>
            <span class="tab" data-tab="tab-colors">Cores</span>
            <span class="tab" data-tab="tab-presets">Presets</span>
            <span class="tab" data-tab="tab-advanced">Avançado</span>
            <span id="toggle-theme">🌙</span>
        </div>

        <!-- =======================
             TAB: BORDA
        ======================== -->
        <div class="tab-content active" id="tab-border">

            <div class="section-title">Formato & Tamanho</div>

            <div class="settings-grid">

                <div>
                    <label>Forma:</label>
                    <select id="shape">
                        <option value="rect">Retângulo</option>
                        <option value="square">Quadrado</option>
                        <option value="ellipse">Elipse</option>
                        <option value="line-h">Linha Horizontal</option>
                        <option value="line-v">Linha Vertical</option>
                    </select>
                </div>

                <div>
                    <label>Largura:</label>
                    <input id="width" type="number" value="900">
                </div>

                <div>
                    <label>Altura:</label>
                    <input id="height" type="number" value="300">
                </div>

                <div>
                    <label>Raio:</label>
                    <input id="radius" type="range" min="0" max="300" value="40">
                </div>

                <div>
                    <label>Espessura:</label>
                    <input id="stroke" type="range" min="1" max="40" value="8">
                </div>

                <div>
                    <label>Velocidade:</label>
                    <input id="speed" type="range" min="2" max="30" value="12">
                </div>

                <div>
                    <label>Opacidade:</label>
                    <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="1">
                </div>

            </div>
        </div>

        <!-- =======================
             TAB: CORES
        ======================== -->
        <div class="tab-content" id="tab-colors">

            <div class="section-title">Cores do Gradiente</div>

            <div>
                <label>Modo:</label>
                <select id="color-mode">
                    <option value="2">2 cores</option>
                    <option value="4" selected>4 cores</option>
                </select>
            </div>

            <div class="settings-grid color-grid">
                <div><label>Cor 1:</label> <input id="color1" type="color" value="#ffb8c6"></div>
                <div><label>Cor 2:</label> <input id="color2" type="color" value="#b6d9ff"></div>
                <div><label>Cor 3:</label> <input id="color3" type="color" value="#ffe7a3"></div>
                <div><label>Cor 4:</label> <input id="color4" type="color" value="#e8c8ff"></div>
            </div>

        </div>

        <!-- =======================
             TAB: PRESETS
        ======================== -->
        <div class="tab-content" id="tab-presets">

            <div class="section-title">Presets rápidos</div>

            <div class="preset-button" data-preset="pastel">🌸 Pastel Dream</div>
            <div class="preset-button" data-preset="sakura">🌺 Sakura Pink</div>
            <div class="preset-button" data-preset="ocean">🌊 Ocean Breeze</div>
            <div class="preset-button" data-preset="space">🚀 Space Vaporwave</div>
            <div class="preset-button" data-preset="toxic">☢️ Toxic Neon</div>
            <div class="preset-button" data-preset="sunset">🌅 Sunset Mix</div>

        </div>

        <!-- =======================
             TAB: AVANÇADO
        ======================== -->
        <div class="tab-content" id="tab-advanced">

            <div class="section-title">Ajustes Avançados</div>

            <div>
                <label>Efeito Glow:</label>
                <select id="glow">
                    <option value="none">Off</option>
                    <option value="soft">Soft Glow</option>
                    <option value="neon">Neon</option>
                    <option value="blurred">Blur forte</option>
                </select>
            </div>

            <div>
                <label>Debug Mode:</label>
                <select id="debug">
                    <option value="off">Off</option>
                    <option value="grid">Grid BG</option>
                    <option value="viewbox">ViewBox Outline</option>
                </select>
            </div>

        </div>

        <!-- =======================
             ANIMAÇÕES — SEÇÃO ESPECIAL
        ======================== -->
        <div id="animations-section">

            <div class="section-title">✨ Animações Premium</div>

            <div id="animation-grid">

                <!-- Cada card terá mini-preview SVG animado real -->
                <!-- Os cards serão inseridos dinamicamente pelo script.js -->

            </div>

        </div>

        <!-- =======================
             LINK OBS
        ======================== -->
        <div class="section-title">Link OBS</div>

        <button id="generate">Gerar URL OBS</button>
        <button id="copy">Copiar URL</button>

        <input id="obs-link" readonly>

    </aside>

    <!-- PREVIEW ÁREA -->
    <div id="preview-area">
        <svg id="preview"></svg>
    </div>

    <script src="script.js"></script>
</body>
</html>
