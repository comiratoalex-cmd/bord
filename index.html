<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Border View</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .border {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-sizing: border-box;
        animation: slide var(--spd, 10s) linear infinite;
        filter: var(--glow, none);
        border-radius: var(--radius, 0px);
    }

    @keyframes slide {
        0% { background-position: 0% 50%; }
        100% { background-position: 400% 50%; }
    }
</style>
</head>

<body>

<div id="border" class="border"></div>

<script>
function p(name, fallback = null) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name) ?? fallback;
}

const el = document.getElementById("border");

const w = Number(p("w", 800));
const h = Number(p("h", 300));
const s = Number(p("s", 10));
const r = Number(p("r", 20));
const spd = Number(p("spd", 10));

const c1 = p("c1", "#ffb8c6");
const c2 = p("c2", "#b6d9ff");
const c3 = p("c3", "#ffe7a3");
const c4 = p("c4", "#e8c8ff");

const mode = p("mode", "4");
const glow = p("glow", "none");

el.style.width = w + "px";
el.style.height = h + "px";
el.style.border = s + "px solid transparent";
el.style.borderRadius = r + "px";
el.style.setProperty("--spd", spd + "s");

const gradient = (mode === "2")
    ? `linear-gradient(90deg, ${c1}, ${c2})`
    : `linear-gradient(90deg, ${c1}, ${c2}, ${c3}, ${c4})`;

el.style.background = gradient;
el.style.backgroundSize = "400% 400%";

if (glow === "neon") {
    el.style.setProperty("--glow",
        "drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px #fff)");
}
</script>

</body>
</html>
