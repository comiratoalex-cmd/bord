<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Neon Pastel Border Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="sidebar">
    <h1 class="title">Candy Neon Border</h1>

    <label>Forma:</label>
    <select id="shape">
        <option value="rect">Retângulo</option>
        <option value="square">Quadrado</option>
        <option value="line-h">Linha Horizontal</option>
        <option value="line-v">Linha Vertical</option>
    </select>

    <label>Largura:</label>
    <input id="width" type="number" value="800">

    <label>Altura:</label>
    <input id="height" type="number" value="300">

    <label>Espessura:</label>
    <input id="stroke" type="number" value="4">

    <label>Raio:</label>
    <input id="radius" type="number" value="25">

    <label>Velocidade:</label>
    <input id="speed" type="number" value="10">

    <label>Modo de Cores:</label>
    <select id="color-mode">
        <option value="2">2 cores</option>
        <option value="4" selected>4 cores</option>
    </select>

    <label>Efeito:</label>
    <select id="effect">
        <option value="none">Nenhum</option>
        <option value="neon">Glow Neon Candy</option>
        <option value="emboss">Emboss Pastel</option>
        <option value="shadow">Sombra Animada</option>
        <option value="turbo">TURBO (tudo)</option>
    </select>

    <label>Cor 1:</label>
    <input id="c1" type="color" value="#aee7ff">

    <label>Cor 2:</label>
    <input id="c2" type="color" value="#ffc0e6">

    <label>Cor 3:</label>
    <input id="c3" type="color" value="#ffe4b3">

    <label>Cor 4:</label>
    <input id="c4" type="color" value="#ffd9c7">

    <button id="presetButton">📦 Presets Candy</button>

    <button id="generate" class="glow-btn">Gerar Link OBS</button>
    <input id="obs-link" readonly>
</div>

<div id="preview-area">
    <div id="previewBar"></div>
</div>

<script src="script.js"></script>
</body>
</html>
