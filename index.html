<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pastel Border Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="panel">
    <h2>Pastel Border Generator</h2>

    <label>Escolher forma:</label>
    <select id="shape">
        <option value="rect">Retângulo</option>
        <option value="square">Quadrado</option>
        <option value="ellipse">Elipse / Círculo</option>
        <option value="line-h">Linha Horizontal</option>
        <option value="line-v">Linha Vertical</option>
        <option value="png">Shape PNG</option>
    </select>

    <div id="size-options">
        <label>Largura:</label>
        <input type="number" id="width" value="800">

        <label>Altura:</label>
        <input type="number" id="height" value="200">

        <label>Raio do canto:</label>
        <input type="number" id="radius" value="20">
    </div>

    <label>Espessura da borda:</label>
    <input type="number" id="stroke" value="8">

    <label>Velocidade da animação:</label>
    <input type="number" id="speed" value="12">

    <label>Upload PNG:</label>
    <input type="file" id="upload" accept="image/png">

    <button id="generate">Gerar Link OBS</button>
    <input id="obs-link" readonly>

</div>

<div id="preview-area">
    <svg id="preview" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script src="script.js"></script>
</body>
</html>
