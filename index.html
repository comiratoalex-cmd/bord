<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>COMIAL PRO — EXTREME</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fx/glass.css">
    <link rel="stylesheet" href="fx/double.css">
    <link rel="stylesheet" href="fx/tokyo.css">
</head>

<body>

<!-- FUNDO ANIMADO -->
<canvas id="bgCanvas"></canvas>

<!-- BOTÃO MOBILE -->
<button id="mobileToggle" class="mobile-toggle">☰</button>

<!-- SIDEBAR -->
<div class="sidebar">

    <h1 class="logo">COMIAL<span>PRO</span></h1>

    <!-- Formato -->
    <div class="module">
        <label>Forma</label>
        <select id="shape">
            <option value="rect">Retângulo</option>
            <option value="square">Quadrado</option>
            <option value="line-h">Linha Horizontal</option>
            <option value="line-v">Linha Vertical</option>
        </select>

        <label>Largura</label>
        <input id="width" type="number" value="800">

        <label>Altura</label>
        <input id="height" type="number" value="300">

        <label>Espessura da Borda</label>
        <input id="stroke" type="number" value="4">

        <label>Raio</label>
        <input id="radius" type="number" value="25">

        <label>Velocidade</label>
        <input id="speed" type="number" value="10">
    </div>

    <!-- Cores -->
    <div class="module">
        <label>Cor 1</label>
        <input id="c1" type="color" value="#ffaad7">

        <label>Cor 2</label>
        <input id="c2" type="color" value="#a6d8ff">

        <label>Cor 3</label>
        <input id="c3" type="color" value="#ffe7ba">

        <label>Cor 4</label>
        <input id="c4" type="color" value="#ffd6f1">
    </div>

    <!-- Efeitos -->
    <div class="module">
        <label><input type="checkbox" id="fx3d"> Modo 3D Neon</label>
        <label><input type="checkbox" id="fxWet"> Wet Glow</label>
        <label><input type="checkbox" id="fxTurbo"> Theowoo Turbo</label>
        <label><input type="checkbox" id="fxAudio"> Áudio Reativo</label>
    </div>

    <div class="module">
        <button id="presetButton" class="btn">Preset Pastel</button>
    </div>

    <div class="module">
        <button id="exportViewer" class="btn">Gerar Link VIEW</button>
        <input id="viewerLink" class="output" readonly>

        <button id="exportOBS" class="btn btn-pro">Gerar Link OBS Transparente</button>
        <input id="obsLink" class="output" readonly>
    </div>

</div>

<!-- PREVIEW -->
<div class="preview-area">
    <div id="preview"></div>
</div>

<!-- SCRIPTS -->
<script src="renderer-extreme.js"></script>
<script src="layers-turbo.js"></script>
<script src="audio-reactor.js"></script>
<script src="background.js"></script>

<script src="script.js"></script>

<!-- MOBILE MENU -->
<script>
document.getElementById("mobileToggle").onclick = () => {
    document.querySelector(".sidebar").classList.toggle("open");
};
</script>

</body>
</html>
