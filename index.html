<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pastel Border Generator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PAINEL DE CONTROLES -->
<div id="panel">

    <h2>Pastel Border Generator</h2>

    <!-- SHAPE -->
    <label>Forma:</label>
    <select id="shape">
        <option value="rect">Retângulo</option>
        <option value="square">Quadrado</option>
        <option value="ellipse">Elipse / Círculo</option>
        <option value="line-h">Linha Horizontal</option>
        <option value="line-v">Linha Vertical</option>
    </select>

    <!-- TAMANHO -->
    <label>Largura:</label>
    <input type="number" id="width" value="800">

    <label>Altura:</label>
    <input type="number" id="height" value="200">

    <!-- ARREDONDAMENTO -->
    <label>Raio do Canto:</label>
    <input type="number" id="radius" value="20">

    <!-- BORDA -->
    <label>Espessura da Borda:</label>
    <input type="number" id="stroke" value="8">

    <!-- ANIMAÇÃO -->
    <label>Velocidade da Animação:</label>
    <input type="number" id="speed" value="12">

    <!-- CORES -->
    <label>Quantidade de Cores:</label>
    <select id="color-mode">
        <option value="2">2 cores</option>
        <option value="4" selected>4 cores</option>
    </select>

    <label>Cor 1:</label>
    <input type="color" id="color1" value="#ffb8c6">

    <label>Cor 2:</label>
    <input type="color" id="color2" value="#e6b5ff">

    <label>Cor 3:</label>
    <input type="color" id="color3" value="#9ed6ff">

    <label>Cor 4:</label>
    <input type="color" id="color4" value="#ffe7c0">

    <!-- GERAR OBS -->
    <button id="generate">Gerar Link para OBS</button>
    <input type="text" id="obs-link" readonly>

</div>


<!-- PREVIEW -->
<div id="preview-area">
    <svg id="preview"></svg>
</div>

<script src="script.js"></script>
</body>
</html>
