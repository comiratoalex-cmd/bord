<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Border Generator — Híbrido</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="sidebar">
    <h1>Pastel Border Generator</h1>

    <label>Forma:</label>
    <select id="shape">
        <option value="rect">Retângulo</option>
        <option value="square">Quadrado</option>
        <option value="ellipse">Elipse</option>
        <option value="line-h">Linha Horizontal</option>
        <option value="line-v">Linha Vertical</option>
    </select>

    <label>Largura:</label>
    <input id="width" type="number" value="800">

    <label>Altura:</label>
    <input id="height" type="number" value="300">

    <label>Espessura:</label>
    <input id="stroke" type="range" min="1" max="40" value="8">

    <label>Raio:</label>
    <input id="radius" type="range" min="0" max="200" value="20">

    <label>Velocidade:</label>
    <input id="speed" type="range" min="2" max="30" value="10">

    <label>Modo de cores:</label>
    <select id="color-mode">
        <option value="2">2 cores</option>
        <option value="4" selected>4 cores</option>
    </select>

    <label>Cor 1:</label>
    <input id="c1" type="color" value="#ffb8c6">
    <label>Cor 2:</label>
    <input id="c2" type="color" value="#b6d9ff">
    <label>Cor 3:</label>
    <input id="c3" type="color" value="#ffe7a3">
    <label>Cor 4:</label>
    <input id="c4" type="color" value="#e8c8ff">

    <button id="generate">Gerar URL</button>
    <input id="obs-link" readonly>
</div>

<div id="preview-area">
    <div id="previewBar"></div>
    <svg id="previewSvg"></svg>
</div>

<script src="script.js"></script>
</body>
</html>
