<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Border View</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }

        svg {
            width: 100vw;
            height: 100vh;
            overflow: visible;
        }

        @keyframes neonPulse {
            0% { filter: drop-shadow(0 0 3px #fff4) drop-shadow(0 0 8px #ffb8c6); }
            50% { filter: drop-shadow(0 0 6px #fff8) drop-shadow(0 0 18px #b6d9ff); }
            100% { filter: drop-shadow(0 0 3px #fff4) drop-shadow(0 0 8px #ffe7a3); }
        }

        .neon-active {
            animation: neonPulse 2.8s ease-in-out infinite;
        }

        .grid-bg {
            background-image:
                linear-gradient(#ffffff22 1px, transparent 1px),
                linear-gradient(90deg, #ffffff22 1px, transparent 1px);
            background-size: 32px 32px;
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .viewbox-border {
            outline: 2px dashed rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <svg id="view"></svg>

    <script>
        const svg = document.getElementById("view");

        function param(name, def = null) {
            return new URLSearchParams(location.search).get(name) ?? def;
        }

        function makeSVG(tag, attrs) {
            const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
            for (let k in attrs) el.setAttribute(k, attrs[k]);
            return el;
        }

        function render() {
            svg.innerHTML = "";

            const w = +param("w", 800);
            const h = +param("h", 200);
            const r = +param("r", 20);
            const s = +param("s", 8);
            const o = +param("o", 1);
            const speed = +param("speed", 12);
            const shape = param("shape", "rect");

            const mode = param("mode", "4");
            const c1 = param("c1", "#ffb8c6");
            const c2 = param("c2", "#b6d9ff");
            const c3 = param("c3", "#ffe7a3");
            const c4 = param("c4", "#e8c8ff");

            const glow = param("glow", "none");
            const debug = param("debug", "off");

            /* ------------------------------
               GRADIENTE COM LOOP PERFEITO
            ------------------------------- */
            let stops = "";

            if (mode === "2") {
                stops = `
                    <stop offset="0%" stop-color="${c1}" />
                    <stop offset="100%" stop-color="${c2}" />
                `;
            }

            if (mode === "4") {
                stops = `
                    <stop offset="0%" stop-color="${c1}" />
                    <stop offset="33%" stop-color="${c2}" />
                    <stop offset="66%" stop-color="${c3}" />
                    <stop offset="100%" stop-color="${c4}" />
                `;
            }

            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");

            defs.innerHTML = `
                <linearGradient id="movingGradient" gradientUnits="userSpaceOnUse">
                    ${stops}

                    <animateTransform 
                        attributeName="gradientTransform"
                        type="translate"
                        from="-600 0"
                        to="600 0"
                        dur="${speed}s"
                        repeatCount="indefinite"
                    />
                </linearGradient>
            `;

            svg.appendChild(defs);

            /* ------------------------------
                SHAPES
            ------------------------------- */
            let el;

            if (shape === "rect") {
                el = makeSVG("rect", {
                    x: s, y: s,
                    width: w - s * 2,
                    height: h - s * 2,
                    rx: r
                });
            }

            if (shape === "square") {
                const size = Math.min(w, h);
                el = makeSVG("rect", {
                    x: s, y: s,
                    width: size - s * 2,
                    height: size - s * 2,
                    rx: r
                });
            }

            if (shape === "ellipse") {
                el = makeSVG("ellipse", {
                    cx: w / 2,
                    cy: h / 2,
                    rx: w / 2 - s,
                    ry: h / 2 - s
                });
            }

            if (shape === "line-h") {
                el = makeSVG("line", {
                    x1: s,
                    y1: h / 2,
                    x2: w - s,
                    y2: h / 2,
                    "stroke-linecap": "round"
                });
            }

            if (shape === "line-v") {
                el = makeSVG("line", {
                    x1: w / 2,
                    y1: s,
                    x2: w / 2,
                    y2: h - s,
                    "stroke-linecap": "round"
                });
            }

            el.setAttribute("stroke", "url(#movingGradient)");
            el.setAttribute("stroke-width", s);
            el.setAttribute("stroke-opacity", o);
            el.setAttribute("fill", "none");

            if (glow === "neon") el.classList.add("neon-active");

            if (debug === "grid") svg.classList.add("grid-bg");
            if (debug === "viewbox") el.classList.add("viewbox-border");

            svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
            svg.appendChild(el);
        }

        render();
    </script>

</body>
</html>
