<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Border View</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        height: 100%;
        width: 100%;
        overflow: hidden;
    }

    #border {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-sizing: border-box;

        background-clip: padding-box, border-box;
        background-origin: padding-box, border-box;

        background-size: 100% 100%, 400% 400%;
        animation: slide var(--spd, 10s) linear infinite;
    }

    @keyframes slide {
        0%   { background-position: 0% 50%; }
        100% { background-position: 400% 50%; }
    }
</style>
</head>

<body>

<div id="border"></div>

<script>
function p(name, fallback=null) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name) ?? fallback;
}

const el = document.getElementById("border");

const shape = p("shape", "rect");
const w = Number(p("w", 800));
const h = Number(p("h", 300));
const s = Number(p("s", 10));
const r = Number(p("r", 20));
const spd = Number(p("spd", 10));

const c1 = p("c1", "#ffb8c6");
const c2 = p("c2", "#b6d9ff");
const c3 = p("c3", "#ffe7a3");
const c4 = p("c4", "#e8c8ff");

const mode = p("mode", "4");

/* FORMAS */
if (shape === "line-h") {
    el.style.width = "85%";
    el.style.height = "18px";
}
else if (shape === "line-v") {
    el.style.width = "18px";
    el.style.height = "85%";
}
else {
    el.style.width = w + "px";
    el.style.height = h + "px";
}

el.style.border = `${s}px solid transparent`;
el.style.borderRadius = `${r}px`;
el.style.setProperty("--spd", `${spd}s`);

const gradient =
    mode === "2"
        ? `linear-gradient(90deg, ${c1}, ${c2})`
        : `linear-gradient(90deg, ${c1}, ${c2}, ${c3}, ${c4})`;

el.style.backgroundImage =
    `linear-gradient(#0000, #0000), ${gradient}`;
</script>

</body>
</html>
