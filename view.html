<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Bord Preview</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
    }

    #container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* Efeito neon opcional */
    @keyframes neonPulse {
        0% {
            filter: drop-shadow(0 0 3px #ffb8c6)
                    drop-shadow(0 0 8px #b6d9ff)
                    drop-shadow(0 0 16px #ffe7a3);
        }
        50% {
            filter: drop-shadow(0 0 6px #ffe7a3)
                    drop-shadow(0 0 14px #e8c8ff)
                    drop-shadow(0 0 22px #ffb8c6);
        }
        100% {
            filter: drop-shadow(0 0 3px #ffb8c6)
                    drop-shadow(0 0 8px #b6d9ff)
                    drop-shadow(0 0 16px #ffe7a3);
        }
    }

    .neon {
        animation: neonPulse 2.6s infinite ease-in-out;
    }
</style>
</head>

<body>

<div id="container">
    <svg id="svg"></svg>
</div>

<script>
/* Pega parâmetros da URL */
function p(name, fallback = null) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name) ?? fallback;
}

/* Criação de shapes */
function makeShape(type, w, h, r, s) {
    const NS = "http://www.w3.org/2000/svg";

    if (type === "rect") {
        let e = document.createElementNS(NS, "rect");
        e.setAttribute("x", s);
        e.setAttribute("y", s);
        e.setAttribute("rx", r);
        e.setAttribute("width", w - s * 2);
        e.setAttribute("height", h - s * 2);
        return e;
    }

    if (type === "square") {
        let size = Math.min(w, h);
        let e = document.createElementNS(NS, "rect");
        e.setAttribute("x", s);
        e.setAttribute("y", s);
        e.setAttribute("rx", r);
        e.setAttribute("width", size - s * 2);
        e.setAttribute("height", size - s * 2);
        return e;
    }

    if (type === "ellipse") {
        let e = document.createElementNS(NS, "ellipse");
        e.setAttribute("cx", w / 2);
        e.setAttribute("cy", h / 2);
        e.setAttribute("rx", w / 2 - s);
        e.setAttribute("ry", h / 2 - s);
        return e;
    }

    if (type === "line-h") {
        let e = document.createElementNS(NS, "line");
        e.setAttribute("x1", 0);
        e.setAttribute("y1", h / 2);
        e.setAttribute("x2", w);
        e.setAttribute("y2", h / 2);
        return e;
    }

    if (type === "line-v") {
        let e = document.createElementNS(NS, "line");
        e.setAttribute("x1", w / 2);
        e.setAttribute("y1", 0);
        e.setAttribute("x2", w / 2);
        e.setAttribute("y2", h);
        return e;
    }
}

/* Renderização */
window.onload = () => {
    const svg = document.getElementById("svg");

    const w = Number(p("w", 800));
    const h = Number(p("h", 300));
    const r = Number(p("r", 20));
    const s = Number(p("s", 8));
    const op = Number(p("op", 1));
    const speed = Number(p("spd", 10));

    const mode = p("mode", "4");

    const c1 = p("c1", "#ffb8c6");
    const c2 = p("c2", "#b6d9ff");
    const c3 = p("c3", "#ffe7a3");
    const c4 = p("c4", "#e8c8ff");

    const glow = p("glow", "none");
    const type = p("shape", "rect");

    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);

    const NS = "http://www.w3.org/2000/svg";

    /* ---------- GRADIENTE ---------- */
    const defs = document.createElementNS(NS, "defs");
    const grad = document.createElementNS(NS, "linearGradient");

    grad.setAttribute("id", "g");
    grad.setAttribute("gradientUnits", "userSpaceOnUse");
    grad.setAttribute("x1", "0");
    grad.setAttribute("y1", "0");
    grad.setAttribute("x2", w);
    grad.setAttribute("y2", "0");

    function stop(offset, color) {
        let st = document.createElementNS(NS, "stop");
        st.setAttribute("offset", offset);
        st.setAttribute("stop-color", color);
        grad.appendChild(st);
    }

    if (mode === "2") {
        stop("0%", c1);
        stop("100%", c2);
    } else {
        stop("0%", c1);
        stop("33%", c2);
        stop("66%", c3);
        stop("100%", c4);
    }

    /* Animação infinita SEM reiniciar */
    const anim = document.createElementNS(NS,"animateTransform");
    anim.setAttribute("attributeName","gradientTransform");
    anim.setAttribute("type","translate");
    anim.setAttribute("dur", `${speed}s`);
    anim.setAttribute("repeatCount","indefinite");
    anim.setAttribute("keyTimes","0;0.5;1");
    anim.setAttribute("values", `-${w} 0; 0 0; -${w} 0`);
    grad.appendChild(anim);

    defs.appendChild(grad);
    svg.appendChild(defs);

    /* ---------- SHAPE ---------- */
    const shape = makeShape(type, w, h, r, s);
    shape.setAttribute("stroke", "url(#g)");
    shape.setAttribute("stroke-width", s);
    shape.setAttribute("fill", "none");
    shape.setAttribute("opacity", op);
    shape.setAttribute("stroke-linecap", "round");

    if (glow === "neon") shape.classList.add("neon");

    svg.appendChild(shape);
};
</script>

</body>
</html>
