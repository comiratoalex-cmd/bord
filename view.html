<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Border View</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }

        #wrap {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Neon glow (quando ativado) */
        .neon {
            filter: drop-shadow(0 0 4px #ffb8c6)
                    drop-shadow(0 0 10px #b6d9ff)
                    drop-shadow(0 0 18px #ffe7a3);
        }

        /* Debug grid */
        .grid-bg {
            background-image:
                linear-gradient(#ffffff22 1px, transparent 1px),
                linear-gradient(90deg, #ffffff22 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Debug viewbox outline */
        .viewbox-outline {
            outline: 2px dashed rgba(255,255,255,0.7);
        }
    </style>
</head>

<body>

<div id="wrap">
    <svg id="svg"></svg>
</div>

<script>
    const svgNS = "http://www.w3.org/2000/svg";

    /* ==========================
       Ler parâmetros da URL
    ========================== */
    function p(name, fallback = null) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name) ?? fallback;
    }

    /* ==========================
       Criar Forma
    ========================== */
    function makeShape(type, w, h, r, s) {
        const el = document.createElementNS(svgNS, type === "ellipse" ? "ellipse" : 
                                            (type.includes("line") ? "line" : "rect"));

        if (type === "rect") {
            el.setAttribute("x", s);
            el.setAttribute("y", s);
            el.setAttribute("rx", r);
            el.setAttribute("width", w - s * 2);
            el.setAttribute("height", h - s * 2);
        }
        if (type === "square") {
            const size = Math.min(w, h);
            el.setAttribute("x", s);
            el.setAttribute("y", s);
            el.setAttribute("rx", r);
            el.setAttribute("width", size - s * 2);
            el.setAttribute("height", size - s * 2);
        }
        if (type === "ellipse") {
            el.setAttribute("cx", w / 2);
            el.setAttribute("cy", h / 2);
            el.setAttribute("rx", w / 2 - s);
            el.setAttribute("ry", h / 2 - s);
        }
        if (type === "line-h") {
            el.setAttribute("x1", 0);
            el.setAttribute("y1", h / 2);
            el.setAttribute("x2", w);
            el.setAttribute("y2", h / 2);
        }
        if (type === "line-v") {
            el.setAttribute("x1", w / 2);
            el.setAttribute("y1", 0);
            el.setAttribute("x2", w / 2);
            el.setAttribute("y2", h);
        }
        return el;
    }

    /* ==========================
       Efeitos Premium
    ========================== */
    const effects = {
        "horizontal": "translate(-100%,0); translate(100%,0); translate(-100%,0)",
        "vertical":   "translate(0,-100%); translate(0,100%); translate(0,-100%)",
        "diagonal":   "translate(-100%,-100%); translate(100%,100%); translate(-100%,-100%)",
        "circular":   "rotate(0 0 0); rotate(360 0 0); rotate(0 0 0)",
        "pulse-slide":"translate(-100%,0); translate(100%,0); translate(-100%,0)",
        "rgb":"rgb",
        "vaporwave":"vapor",
        "prism":"prism",
        "blend":"blend"
    };

    /* ==========================
       Inicializar
    ========================== */
    window.onload = () => {
        const svg = document.getElementById("svg");

        const w    = +p("w", 900);
        const h    = +p("h", 300);
        const r    = +p("r", 20);
        const s    = +p("s", 8);
        const spd  = +p("spd", 10);
        const op   = +p("op", 1);

        const mode = p("mode", "4");
        const c1   = p("c1", "#ffb8c6");
        const c2   = p("c2", "#b6d9ff");
        const c3   = p("c3", "#ffe7a3");
        const c4   = p("c4", "#e8c8ff");

        const glow = p("glow", "none");
        const dbg  = p("debug", "off");
        const anim = p("anim", "horizontal");

        svg.setAttribute("viewBox", `0 0 ${w} ${h}`);

        const defs = document.createElementNS(svgNS, "defs");
        svg.appendChild(defs);

        /* ===========
           GRADIENTE
        =========== */
        const grad = document.createElementNS(svgNS, "linearGradient");
        grad.setAttribute("id", "g");
        grad.setAttribute("gradientUnits", "userSpaceOnUse");
        grad.setAttribute("x1", "0");
        grad.setAttribute("y1", "0");
        grad.setAttribute("x2", w);
        grad.setAttribute("y2", "0");

        function addStop(offset, color) {
            const st = document.createElementNS(svgNS, "stop");
            st.setAttribute("offset", offset);
            st.setAttribute("stop-color", color);
            grad.appendChild(st);
        }

        if (mode === "2") {
            addStop("0%", c1);
            addStop("100%", c2);
        } else {
            addStop("0%", c1);
            addStop("33%", c2);
            addStop("66%", c3);
            addStop("100%", c4);
        }

        const animNode = document.createElementNS(svgNS, "animateTransform");
        animNode.setAttribute("attributeName", "gradientTransform");
        animNode.setAttribute("type", "translate");
        animNode.setAttribute("dur", `${spd}s`);
        animNode.setAttribute("repeatCount", "indefinite");
        animNode.setAttribute("keyTimes", "0;0.5;1");

        const fx = effects[anim];
        if (fx) animNode.setAttribute("values", fx);

        grad.appendChild(animNode);
        defs.appendChild(grad);

        /* ===========
           SHAPE
        =========== */
        const shapeType = p("shape", "rect");
        const shape = makeShape(shapeType, w, h, r, s);

        shape.setAttribute("fill", "none");
        shape.setAttribute("stroke", "url(#g)");
        shape.setAttribute("stroke-width", s);
        shape.setAttribute("stroke-linecap", "round");
        shape.setAttribute("opacity", op);

        if (glow === "neon") shape.classList.add("neon");

        svg.appendChild(shape);

        /* ===========
           DEBUG
        =========== */
        const wrap = document.getElementById("wrap");

        wrap.classList.toggle("grid-bg", dbg === "grid");
        svg.classList.toggle("viewbox-outline", dbg === "viewbox");
    };
</script>

</body>
</html>
