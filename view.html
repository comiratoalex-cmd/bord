<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>COMIAL PRO — VIEW</title>

<link rel="stylesheet" href="style.css">

<style>
body { overflow:hidden; }
.preview-holder {
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
#preview {
    pointer-events:none;
}
</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>

<div class="preview-holder">
    <div id="preview"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const get = (k, d=null) => params.get(k) ?? d;

function injectInputs() {
    const inputs = `
        <input id="shape" value="${get("shape")}">
        <input id="width" value="${get("width")}">
        <input id="height" value="${get("height")}">
        <input id="stroke" value="${get("stroke")}">
        <input id="radius" value="${get("radius")}">
        <input id="speed" value="${get("speed")}">

        <input id="c1" value="${get("c1")}">
        <input id="c2" value="${get("c2")}">
        <input id="c3" value="${get("c3")}">
        <input id="c4" value="${get("c4")}">

        <input id="fx3d" ${get("fx3d")==="true"?"checked":""}>
        <input id="fxWet" ${get("fxWet")==="true"?"checked":""}>
        <input id="fxTurbo" ${get("fxTurbo")==="true"?"checked":""}>
        <input id="fxAudio" ${get("fxAudio")==="true"?"checked":""}>
    `;
    document.body.insertAdjacentHTML("beforeend", inputs);
}

/* Carregar scripts */
function load(src) {
    return new Promise(ok=>{
        let s=document.createElement("script");
        s.src=src;
        s.onload=ok;
        document.body.appendChild(s);
    });
}

(async()=>{
    injectInputs();

    await load("background.js");
    await load("renderer-extreme.js");
    await load("layers-turbo.js");
    await load("audio-reactor.js");

    renderAllLayers();
})();
</script>

</body>
</html>
