<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bord View</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:transparent;
    width:100%;
    height:100%;
    overflow:hidden;
}
svg{
    width:100%;
    height:100%;
}
.neon{
    filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px #ff9acb);
}
</style>
</head>
<body>

<svg id="svg"></svg>

<script>
function get(p,def=null){
    const u=new URL(window.location.href);
    return u.searchParams.get(p) ?? def;
}

window.onload = ()=>{

    const w = Number(get("width",900));
    const h = Number(get("height",300));
    const r = Number(get("radius",20));
    const s = Number(get("stroke",8));
    const op = Number(get("opacity",1));
    const speed = Number(get("speed",10));

    const shape = get("shape","rect");
    const mode = get("colormode","4");
    const glow = get("glow","none");
    const anim = get("anim","horizontal");

    const c1 = get("color1","#ffb8c6");
    const c2 = get("color2","#b6d9ff");
    const c3 = get("color3","#ffe7a3");
    const c4 = get("color4","#e8c8ff");

    const NS="http://www.w3.org/2000/svg";
    const svg=document.getElementById("svg");
    svg.setAttribute("viewBox",`0 0 ${w} ${h}`);

    /* gradient */
    const defs=document.createElementNS(NS,"defs");
    const grad=document.createElementNS(NS,"linearGradient");
    grad.setAttribute("id","g");
    grad.setAttribute("gradientUnits","userSpaceOnUse");

    if(anim==="horizontal"){
        grad.setAttribute("x1","0");
        grad.setAttribute("y1","0");
        grad.setAttribute("x2",w);
        grad.setAttribute("y2","0");
    }
    if(anim==="vertical"){
        grad.setAttribute("x1","0");
        grad.setAttribute("y1","0");
        grad.setAttribute("x2","0");
        grad.setAttribute("y2",h);
    }
    if(anim==="diagonal"){
        grad.setAttribute("x1","0");
        grad.setAttribute("y1","0");
        grad.setAttribute("x2",w);
        grad.setAttribute("y2",h);
    }

    function stop(off,col){
        const st=document.createElementNS(NS,"stop");
        st.setAttribute("offset",off);
        st.setAttribute("stop-color",col);
        grad.appendChild(st);
    }

    if(mode==="2"){
        stop("0%",c1);
        stop("100%",c2);
    }else{
        stop("0%",c1);
        stop("33%",c2);
        stop("66%",c3);
        stop("100%",c4);
    }

    const animLoop=document.createElementNS(NS,"animate");
    animLoop.setAttribute("attributeName","gradientTransform");
    animLoop.setAttribute("type","translate");
    animLoop.setAttribute("dur",`${speed}s`);
    animLoop.setAttribute("repeatCount","indefinite");
    animLoop.setAttribute("values",`0 0; -${w} 0`);
    animLoop.setAttribute("keyTimes","0;1");
    grad.appendChild(animLoop);

    defs.appendChild(grad);
    svg.appendChild(defs);

    /* SHAPES FIXED ✔ */
    let el;

    if(shape==="rect"){
        el=document.createElementNS(NS,"rect");
        el.setAttribute("x",s);
        el.setAttribute("y",s);
        el.setAttribute("width",w-s*2);
        el.setAttribute("height",h-s*2);
        el.setAttribute("rx",r);
    }

    if(shape==="square"){
        const size=Math.min(w,h);
        el=document.createElementNS(NS,"rect");
        el.setAttribute("x",s);
        el.setAttribute("y",s);
        el.setAttribute("width",size-s*2);
        el.setAttribute("height",size-s*2);
        el.setAttribute("rx",r);
    }

    if(shape==="ellipse"){
        el=document.createElementNS(NS,"ellipse");
        el.setAttribute("cx",w/2);
        el.setAttribute("cy",h/2);
        el.setAttribute("rx",w/2-s);
        el.setAttribute("ry",h/2-s);
    }

    if(shape==="line-h"){
        el=document.createElementNS(NS,"line");
        el.setAttribute("x1",0);
        el.setAttribute("y1",h/2);
        el.setAttribute("x2",w);
        el.setAttribute("y2",h/2);
    }

    if(shape==="line-v"){
        el=document.createElementNS(NS,"line");
        el.setAttribute("x1",w/2);
        el.setAttribute("y1",0);
        el.setAttribute("x2",w/2);
        el.setAttribute("y2",h);
    }

    el.setAttribute("stroke","url(#g)");
    el.setAttribute("stroke-width",s);
    el.setAttribute("fill","none");
    el.setAttribute("opacity",op);
    el.setAttribute("stroke-linecap","round");

    if(glow==="neon") el.classList.add("neon");

    svg.appendChild(el);
};
</script>

</body>
</html>
