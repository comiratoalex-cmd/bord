<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Border View</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }
        #root {
            width: 100vw;
            height: 100vh;
        }

        svg {
            width: 100vw;
            height: 100vh;
            overflow: visible;
        }

        @keyframes neonPulse {
            0% { filter: drop-shadow(0 0 3px #fff4) drop-shadow(0 0 8px #ffb8c6); }
            50% { filter: drop-shadow(0 0 6px #fff8) drop-shadow(0 0 18px #b6d9ff); }
            100% { filter: drop-shadow(0 0 3px #fff4) drop-shadow(0 0 8px #ffe7a3); }
        }

        .neon-active {
            animation: neonPulse 2.8s ease-in-out infinite;
        }

        .grid-bg {
            background-image:
                linear-gradient(#ffffff22 1px, transparent 1px),
                linear-gradient(90deg, #ffffff22 1px, transparent 1px);
            background-size: 32px 32px;
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .viewbox-border {
            outline: 2px dashed rgba(255,255,255,0.5);
        }
    </style>

</head>
<body>

    <div id="root">
        <svg id="view"></svg>
    </div>

    <script>
        const svg = document.getElementById("view");

        function getParam(p, def = null) {
            return new URLSearchParams(window.location.search).get(p) ?? def;
        }

        function makeSVG(tag, attrs) {
            const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
            for (let k in attrs) el.setAttribute(k, attrs[k]);
            return el;
        }

        function render() {
            svg.innerHTML = "";

            const w = +getParam("w", 800);
            const h = +getParam("h", 200);
            const r = +getParam("r", 20);
            const s = +getParam("s", 8);
            const opacity = +getParam("o", 1);
            const speed = +getParam("speed", 10);
            const shape = getParam("shape", "rect");

            const mode = getParam("mode", "4");
            const c1 = getParam("c1", "#ffb8c6");
            const c2 = getParam("c2", "#b6d9ff");
            const c3 = getParam("c3", "#ffe7a3");
            const c4 = getParam("c4", "#e8c8ff");

            const glow = getParam("glow", "none");
            const debug = getParam("debug", "off");

            /* --------------------------
               DEFINIÇÃO DO GRADIENTE
            --------------------------- */
            let stops = "";

            if (mode === "2") {
                stops = `
                    <stop offset="0%" stop-color="${c1}" />
                    <stop offset="100%" stop-color="${c2}" />
                `;
            }

            if (mode === "4") {
                stops = `
                    <stop offset="0%" stop-color="${c1}" />
                    <stop offset="33%" stop-color="${c2}" />
                    <stop offset="66%" stop-color="${c3}" />
                    <stop offset="100%" stop-color="${c4}" />
                `;
            }

            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            defs.innerHTML = `
                <linearGradient id="movingGradient" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="600" y2="0">
                    ${stops}
                    <animate attributeName="x1" values="0;-600" dur="${speed}s" repeatCount="indefinite"/>
                    <animate attributeName="x2" values="600;0" dur="${speed}s" repeatCount="indefinite"/>
                </linearGradient>
            `;
            svg.appendChild(defs);

            /* --------------------------
               DESENHAR A FORMA
            --------------------------- */
            let element;

            if (shape === "rect") {
                element = makeSVG("rect", {
                    x: s, y: s,
                    width: w - s * 2,
                    height: h - s * 2,
                    rx: r
                });
            }

            if (shape === "square") {
                const size = Math.min(w, h);
                element = makeSVG("rect", {
                    x: s, y: s,
                    width: size - s * 2,
                    height: size - s * 2,
                    rx: r
                });
            }

            if (shape === "ellipse") {
                element = makeSVG("ellipse", {
                    cx: w / 2,
                    cy: h / 2,
                    rx: w / 2 - s,
                    ry: h / 2 - s
                });
            }

            if (shape === "line-h") {
                element = makeSVG("line", {
                    x1: s,
                    y1: h / 2,
                    x2: w - s,
                    y2: h / 2,
                    "stroke-linecap": "round"
                });
            }

            if (shape === "line-v") {
                element = makeSVG("line", {
                    x1: w / 2,
                    y1: s,
                    x2: w / 2,
                    y2: h - s,
                    "stroke-linecap": "round"
                });
            }

            element.setAttribute("stroke", "url(#movingGradient)");
            element.setAttribute("stroke-width", s);
            element.setAttribute("stroke-opacity", opacity);
            element.setAttribute("fill", "none");

            if (glow === "neon") {
                element.classList.add("neon-active");
            }

            if (debug === "grid") {
                svg.classList.add("grid-bg");
            }

            if (debug === "viewbox") {
                element.classList.add("viewbox-border");
            }

            svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
            svg.appendChild(element);
        }

        render();
    </script>

</body>
</html>
